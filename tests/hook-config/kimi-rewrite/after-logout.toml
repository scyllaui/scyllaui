default_model = ""

[[hooks]]
event = "SessionStart"
command = "~/bin/my-hook.sh start"
timeout = 5

[[hooks]]
event = "SessionStart"
command = "if [ -n \"${SCYLLAUI_SOCK:-}\" ] && [ -x \"${SCYLLAUI_BIN:-}\" ]; then \"$SCYLLAUI_BIN\" hook --config kimi; fi"
timeout = 2

[[hooks]]
event = "UserPromptSubmit"
command = "if [ -n \"${SCYLLAUI_SOCK:-}\" ] && [ -x \"${SCYLLAUI_BIN:-}\" ]; then \"$SCYLLAUI_BIN\" hook --config kimi; fi"
timeout = 2

[[hooks]]
event = "PermissionRequest"
command = "if [ -n \"${SCYLLAUI_SOCK:-}\" ] && [ -x \"${SCYLLAUI_BIN:-}\" ]; then \"$SCYLLAUI_BIN\" hook --config kimi; fi"
timeout = 2

[[hooks]]
event = "PermissionResult"
command = "if [ -n \"${SCYLLAUI_SOCK:-}\" ] && [ -x \"${SCYLLAUI_BIN:-}\" ]; then \"$SCYLLAUI_BIN\" hook --config kimi; fi"
timeout = 2

[[hooks]]
event = "PostToolUse"
command = "if [ -n \"${SCYLLAUI_SOCK:-}\" ] && [ -x \"${SCYLLAUI_BIN:-}\" ]; then \"$SCYLLAUI_BIN\" hook --config kimi; fi"
timeout = 2

[[hooks]]
event = "Notification"
command = "if [ -n \"${SCYLLAUI_SOCK:-}\" ] && [ -x \"${SCYLLAUI_BIN:-}\" ]; then \"$SCYLLAUI_BIN\" hook --config kimi; fi"
timeout = 2

[[hooks]]
event = "Stop"
command = "if [ -n \"${SCYLLAUI_SOCK:-}\" ] && [ -x \"${SCYLLAUI_BIN:-}\" ]; then \"$SCYLLAUI_BIN\" hook --config kimi; fi"
timeout = 2

[[hooks]]
event = "StopFailure"
command = "if [ -n \"${SCYLLAUI_SOCK:-}\" ] && [ -x \"${SCYLLAUI_BIN:-}\" ]; then \"$SCYLLAUI_BIN\" hook --config kimi; fi"
